<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 300px; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; color: #1a1a1a; }
    header { background: #1a1a1a; color: #f5f0e8; padding: 12px 16px; font-weight: 600; }
    .body { padding: 14px 16px; }
    label { display: block; font-size: 11px; color: #6b6b6b; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #e3e0d8; border-radius: 8px; font-size: 13px; }
    input:focus { outline: none; border-color: #1a1a1a; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: none; border-radius: 8px; background: #1a1a1a; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    button:hover { background: #333; }
    .stats { margin-top: 14px; padding: 10px 12px; background: #f5f0e8; border-radius: 8px; font-size: 12px; line-height: 1.6; }
    .stats b { font-weight: 600; }
    .msg { margin-top: 10px; font-size: 12px; text-align: center; min-height: 16px; }
    .msg.ok { color: #167c4a; }
    .msg.err { color: #c0392b; }
    .note { margin-top: 14px; font-size: 11px; color: #9a9a9a; line-height: 1.5; }
  </style>
</head>
<body>
  <header>October AI · LinkedIn Outreach</header>
  <div class="body">
    <label>Dashboard URL</label>
    <input id="apiBase" type="text" placeholder="https://…railway.app" />
    <label>Admin token</label>
    <input id="token" type="password" placeholder="x-admin-token" />
    <button id="save">Save &amp; test connection</button>
    <div id="msg" class="msg"></div>
    <div id="stats" class="stats" style="display:none"></div>
    <div class="note">
      Open a LinkedIn tab to use the floating panel. The extension fills drafts
      into the compose box — you always review and click Send yourself.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
